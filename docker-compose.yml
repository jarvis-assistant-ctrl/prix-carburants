services:
  app:
    build: .
    container_name: prix-carburants
    restart: unless-stopped
    ports:
      - "3200:3200"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ./prix-carburants.db:/app/prix-carburants.db
    environment:
      - NODE_ENV=production
      - PORT=3200
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: prix-carburants-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app