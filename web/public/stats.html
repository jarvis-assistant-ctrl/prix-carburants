<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Stats Prix Carburants</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            color: #1a1a2e;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2em; color: #16213e; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-value { font-size: 2em; font-weight: bold; color: #667eea; }
        .stat-label { color: #64748b; margin-top: 5px; font-size: 0.9em; }
        .chart-container {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-title { margin-bottom: 15px; font-size: 1.1em; color: #16213e; }
        #hourlyChart { height: 200px; max-height: 200px; }
        #hourlyText { font-family: monospace; font-size: 12px; color: #666; margin-bottom: 10px; }
        .endpoint-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .endpoint-name { color: #16213e; }
        .endpoint-count { font-weight: bold; color: #667eea; }
        .update-info { text-align: center; color: #94a3b8; margin-top: 20px; font-size: 0.85em; }
        
        /* Login form */
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 350px;
            margin: 100px auto;
        }
        .login-box h2 { margin: 0 0 1rem; color: #16213e; }
        .login-box input {
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            width: 200px;
            margin-bottom: 1rem;
        }
        .login-box input:focus { outline: none; border-color: #667eea; }
        .login-box button {
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        .login-box button:hover { background: #5a67d8; }
        .error { color: #dc3545; margin-top: 0.5rem; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="/chart.min.js"></script>
    <script>
    const STATS_PASSWORD = 'jarvis2026';
    const app = document.getElementById('app');
    
    // Vérifier le password dans localStorage (avec timeout 1h)
    const STATS_PASSWORD = 'jarvis2026';
    const TIMEOUT_MS = 60 * 60 * 1000; // 1 heure
    
    let password = localStorage.getItem('stats_password');
    const lastAuth = parseInt(localStorage.getItem('stats_auth_time') || '0');
    const now = Date.now();
    
    // Si timeout expiré, effacer le password
    if (password && (now - lastAuth > TIMEOUT_MS)) {
        localStorage.removeItem('stats_password');
        localStorage.removeItem('stats_auth_time');
        password = null;
    }
    
    if (!password) {
        // Afficher le formulaire de login
        app.innerHTML = `
        <div class="login-box">
            <h2>📊 Accès Stats</h2>
            <input type="password" id="pwd" placeholder="Mot de passe" autofocus>
            <br><br>
            <button onclick="login()">Accéder</button>
            <p id="error" class="error" style="display:none;">Mot de passe incorrect</p>
        </div>`;
        document.getElementById('pwd').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    } else {
        showStats();
    }
    
    function login() {
        const pwd = document.getElementById('pwd').value;
        if (pwd === STATS_PASSWORD) {
            localStorage.setItem('stats_password', pwd);
            localStorage.setItem('stats_auth_time', Date.now().toString());
            password = pwd;
            showStats();
        } else {
            document.getElementById('error').style.display = 'block';
        }
    }
    
    function showStats() {
        app.innerHTML = `
        <div class="container">
            <h1>📊 Stats Prix Carburants</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalRequests">-</div>
                    <div class="stat-label">Total requêtes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="peakHour">-</div>
                    <div class="stat-label">Heure de pointe</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="peakCount">-</div>
                    <div class="stat-label">Max/heure</div>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-title">📈 Requêtes par heure</div>
                <div id="hourlyText">Chargement...</div>
                <canvas id="hourlyChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">📍 Endpoints populaires</div>
                <div id="endpointsList"></div>
            </div>
            <div class="update-info">
                Dernière MAJ: <span id="lastUpdate">-</span>
            </div>
        </div>`;
        loadStats();
        setInterval(loadStats, 30000);
    }
    
    async function loadStats() {
        try {
            const res = await fetch('/api/stats?password=' + password);
            if (!res.ok) {
                localStorage.removeItem('stats_password');
                location.reload();
                return;
            }
            const data = await res.json();
            updateDisplay(data);
        } catch (e) {
            document.getElementById('hourlyText').innerHTML = '<span style="color:red">Erreur: ' + e.message + '</span>';
        }
    }
    
    function updateDisplay(data) {
        document.getElementById('totalRequests').textContent = (data.total_requests || 0).toLocaleString();
        document.getElementById('peakHour').textContent = data.peak_hour || '-';
        document.getElementById('peakCount').textContent = (data.peak_count || 0).toLocaleString();

        const hourlyText = Object.entries(data.hourly || {})
            .sort((a, b) => parseInt(a[0]) - parseInt(b[0]))
            .map(([h, v]) => `${h}: ${v}`)
            .join(' | ');
        document.getElementById('hourlyText').textContent = hourlyText || 'Aucune donnée';

        const sorted = Object.entries(data.endpoints || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
        document.getElementById('endpointsList').innerHTML = sorted
            .map(([ep, count]) => `<div class="endpoint-item"><span class="endpoint-name">${ep}</span><span class="endpoint-count">${count}</span></div>`)
            .join('');

        if (typeof Chart !== 'undefined') {
            const labels = [], values = [];
            for (let h = 0; h < 24; h++) {
                labels.push(h + 'h');
                values.push(data.hourly[`${h}h-${h+1}h`] || 0);
            }
            const ctx = document.getElementById('hourlyChart').getContext('2d');
            if (window.hourlyChart && typeof window.hourlyChart.destroy === 'function') {
                window.hourlyChart.destroy();
            }
            window.hourlyChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Req', data: values, backgroundColor: '#667eea' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('fr-FR');
    }
    </script>
</body>
</html>
