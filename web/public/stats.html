<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Stats Prix Carburants</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            color: #1a1a2e;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2em; color: #16213e; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-value { font-size: 2em; font-weight: bold; color: #16a34a; }
        .stat-label { color: #64748b; margin-top: 5px; font-size: 0.9em; }
        .chart-container {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .chart-title { margin-bottom: 15px; font-size: 1.1em; color: #16213e; }
        #hourlyChart { height: 200px; max-height: 200px; }
        #hourlyText { font-family: monospace; font-size: 12px; color: #666; margin-bottom: 10px; }
        .endpoint-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .endpoint-name { color: #16213e; }
        .endpoint-count { font-weight: bold; color: #16a34a; }
        .update-info { text-align: center; color: #94a3b8; margin-top: 20px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Stats Prix Carburants</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalRequests">-</div>
                <div class="stat-label">Total requêtes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="peakHour">-</div>
                <div class="stat-label">Heure de pointe</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="peakCount">-</div>
                <div class="stat-label">Max/heure</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">📈 Requêtes par heure</div>
            <div id="hourlyText">Chargement...</div>
            <canvas id="hourlyChart"></canvas>
        </div>

        <div class="chart-container">
            <div class="chart-title">📍 Endpoints populaires</div>
            <div id="endpointsList"></div>
        </div>

        <div class="update-info">
            Dernière MAJ: <span id="lastUpdate">-</span>
        </div>
    </div>

    <script src="/chart.min.js"></script>
    <script>
    console.log('Page chargée, Chart.js:', typeof Chart);
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM prêt');
        
        async function loadStats() {
            try {
                console.log('Chargement stats...');
                const res = await fetch('/api/stats');
                const data = await res.json();
                console.log('Données reçues:', data);
                updateDisplay(data);
            } catch (e) {
                console.error('Erreur:', e);
                document.getElementById('hourlyText').innerHTML = '<span style="color:red">Erreur: ' + e.message + '</span>';
            }
        }

        function updateDisplay(data) {
            console.log('updateDisplay:', data);
            
            // Stats globales
            document.getElementById('totalRequests').textContent = data.total_requests.toLocaleString();
            document.getElementById('peakHour').textContent = data.peak_hour || '-';
            document.getElementById('peakCount').textContent = data.peak_count.toLocaleString();

            // Données horaires en texte
            const hourlyText = Object.entries(data.hourly || {})
                .sort((a, b) => {
                    const hA = parseInt(a[0]);
                    const hB = parseInt(b[0]);
                    return hA - hB;
                })
                .map(([h, v]) => `${h}: ${v}`)
                .join(' | ');
            document.getElementById('hourlyText').textContent = hourlyText || 'Aucune donnée';

            // Endpoints
            const endpointsList = document.getElementById('endpointsList');
            const sorted = Object.entries(data.endpoints || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
            endpointsList.innerHTML = sorted.map(([ep, count]) => 
                `<div class="endpoint-item"><span class="endpoint-name">${ep}</span><span class="endpoint-count">${count}</span></div>`
            ).join('');

            // Graphique
            if (typeof Chart === 'undefined') {
                console.error('Chart.js non chargé !');
                return;
            }

            const labels = [];
            const values = [];
            for (let h = 0; h < 24; h++) {
                labels.push(h + 'h');
                values.push(data.hourly[`${h}h-${h+1}h`] || 0);
            }

            const ctx = document.getElementById('hourlyChart').getContext('2d');
            
            // Détruire l'ancien graphique s'il existe
            if (window.hourlyChart) {
                window.hourlyChart.destroy();
            }
            
            window.hourlyChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Req', data: values, backgroundColor: '#16a34a' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('fr-FR');
        }

        loadStats();
        setInterval(loadStats, 30000);
    });
    </script>
</body>
</html>
